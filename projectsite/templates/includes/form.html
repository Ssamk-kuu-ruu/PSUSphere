{% comment %} Render a Django form's fields with basic Bootstrap markup {% endcomment %}
{% for field in form %}
  <div class="form-group">
    {{ field.label_tag }}
    {{ field.errors }}
    {{ field }}
    {% if field.help_text %}
      <small class="form-text text-muted">{{ field.help_text }}</small>
    {% endif %}
  </div>
{% endfor %}
